name: Wallet authorization demo

on:
  pull_request:
    paths:
      - 'examples/wallet-authorization-demo/**'
      - 'python/src/**'
      - '.github/workflows/wallet-authorization-demo.yml'
  push:
    branches: [main]
    paths:
      - 'examples/wallet-authorization-demo/**'
      - 'python/src/**'
      - '.github/workflows/wallet-authorization-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wallet-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: veritaschain/vap-spec
          ref: 7bdec510e3ed1f15a8362d30516acd7b161b9987
          path: .companions/vap-spec
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the demo cryptography dependency
        run: python -m pip install 'cryptography==50.0.2'
      - name: Verify SDK records and pinned companion evidence
        env:
          VCP_WALLET_VAP_SPEC: ${{ github.workspace }}/.companions/vap-spec
        run: python -m unittest discover -s examples/wallet-authorization-demo -p test_demo.py -v
