name: Evidence adapter parity
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sdk
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: veritaschain/vcp-explorer-api
          ref: c3d67ab2467a55e017f652b38a2b89c3f4a7cee7
          path: api
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Build SDK and compare actual portable API checks
        working-directory: sdk
        env:
          VCP_EVIDENCE_API_CORE: ${{ github.workspace }}/api/src/evidence/core.ts
        run: |
          npm --prefix typescript ci --ignore-scripts --no-audit
          npm --prefix typescript run build
          node --test typescript/test/evidence-adapter-parity.integration.mjs
      - name: Prepare pinned source and reproduction receipt
        working-directory: sdk
        run: |
          mkdir -p reproduction
          git archive --format=zip --prefix=vcp-sdk/ HEAD > reproduction/sdk-source.zip
          git rev-parse HEAD > reproduction/SOURCE_COMMIT.txt
          printf '%s\n' 'API c3d67ab2467a55e017f652b38a2b89c3f4a7cee7' > reproduction/API_COMMIT.txt
          sha256sum reproduction/sdk-source.zip > reproduction/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replay-source-${{ github.sha }}
          path: sdk/reproduction/
          retention-days: 30
          if-no-files-found: error
