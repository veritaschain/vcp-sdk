name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
      - name: Installer integrity gate regressions (synthetic, no Wine)
        run: python -m unittest discover -s tools/mql5 -p 'test_*.py' -v
      - name: Python tests
        working-directory: python
        run: |
          pip install -e ".[test,blake3]"
          pytest -q
      - name: Vectors are reproducible
        run: |
          python tools/generate_vectors.py
          python tools/gen_mql5_selftest.py
          python tools/generate_explorer_demo.py
          git diff --exit-code test-vectors mql5 examples/explorer-demo/bundle.json examples/explorer-demo/trust.json
      - name: TypeScript tests
        working-directory: typescript
        run: |
          npm ci
          npm test
      - name: Cross-language check
        run: tools/crosslang/run.sh
      - name: Merkle cross-check against transparency-dev/merkle
        run: |
          cd tools/merkle-crosscheck-go && go run . 64 > /tmp/go-merkle.jsonl
          cd ../.. && python tools/merkle-crosscheck-go/compare.py /tmp/go-merkle.jsonl
