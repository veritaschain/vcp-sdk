name: Public evidence API probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/probe_public_evidence.py'
      - 'tools/test_public_evidence_probe.py'
      - 'tools/replay_explorer_demo.mjs'
      - 'typescript/src/**'
      - 'typescript/test/**'
      - 'typescript/package*.json'
      - 'examples/explorer-demo/**'
      - '.github/workflows/public-evidence-probe.yml'
  push:
    branches: [main]
    paths:
      - 'tools/probe_public_evidence.py'
      - 'tools/test_public_evidence_probe.py'
      - 'tools/replay_explorer_demo.mjs'
      - 'typescript/src/**'
      - 'typescript/test/**'
      - 'typescript/package*.json'
      - 'examples/explorer-demo/**'
      - '.github/workflows/public-evidence-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Record client and source versions
        shell: bash
        run: |
          git rev-parse HEAD
          node --version
          python3 --version
          curl --version
      - name: Test transports and negative controls without the public host
        run: python3 tools/test_public_evidence_probe.py -v
      - name: Build SDK and run offline replay tests
        shell: bash
        run: |
          npm --prefix typescript ci --ignore-scripts --no-audit
          npm --prefix typescript run build
          node --test typescript/test/explorer-replay*.test.mjs
      - name: Probe fixed public endpoints and recompute downloaded evidence
        run: python3 tools/probe_public_evidence.py --output public-evidence-probe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-evidence-probe/
          if-no-files-found: warn
          retention-days: 30
