name: Public evidence API probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/probe_public_evidence.py'
      - 'tools/test_public_evidence_probe.py'
      - 'tools/replay_explorer_demo.mjs'
      - '.github/workflows/public-evidence-probe.yml'
  push:
    branches: [main]
    paths:
      - 'tools/probe_public_evidence.py'
      - 'tools/test_public_evidence_probe.py'
      - 'tools/replay_explorer_demo.mjs'
      - '.github/workflows/public-evidence-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    # Read-only requests to a fixed public synthetic demo. No secrets or writes.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Record client and source versions
        shell: bash
        run: |
          git rev-parse HEAD
          node --version
          python3 --version
          curl --version
      - name: Test transports and negative controls without the public host
        run: python3 tools/test_public_evidence_probe.py -v
      - name: Build SDK and run offline replay tests
        shell: bash
        run: |
          npm --prefix typescript ci --ignore-scripts --no-audit
          npm --prefix typescript run build
          node --test typescript/test/explorer-replay.test.mjs
      - name: Probe fixed public endpoints and recompute downloaded evidence
        run: python3 tools/probe_public_evidence.py --output public-evidence-probe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-evidence-probe/
          if-no-files-found: warn
          retention-days: 30
