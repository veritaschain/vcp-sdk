[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "veritaschain-vcp"
version = "0.1.0"
description = "Offline core for VeritasChain Protocol (VCP) v1.2 events: canonical hashing, RFC 6962 Merkle trees, Ed25519, three-valued verification. Pre-release; first-party (VeritasChain Co., Ltd.)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "VeritasChain Co., Ltd.", email = "standards@veritaschain.org" }]
dependencies = ["cryptography>=41"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
blake3 = ["blake3>=0.4"]
test = ["pytest>=7", "rfc8785>=0.1.4", "jsonschema>=4.18"]

[project.urls]
Source = "https://github.com/veritaschain/vcp-sdk"
Specification = "https://github.com/veritaschain/vcp-spec/tree/v1.2.0/spec/v1.2"

[project.scripts]
vcp = "veritaschain_vcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
